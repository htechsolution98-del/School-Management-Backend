name: School-Management-Backend

on:
  push:
    branches:
      - stg

concurrency:
  group: backend-stg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          for v in SSH_KEY SSH_HOST SSH_PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is empty or not available to this workflow"
              exit 1
            fi
          done

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          if ! ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"; then
            echo "::error::ssh-keyscan failed for the host/port secrets: no route, firewall block, or wrong port"
            exit 1
          fi
          [ -s "$HOME/.ssh/known_hosts" ] || { echo "::error::No host key retrieved"; exit 1; }

      - name: Deploy Backend
        run: |
          ssh -T -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'SSHEOF'
          set -e

          cd -- "${{ secrets.BACKEND_WORK_DIR }}"

          # Keep the server's compose configuration outside the checkout when
          # it is untracked, so the incoming tracked file can be checked out.
          if ! git ls-files --error-unmatch -- docker-compose.yml >/dev/null 2>&1; then
            if [ -e docker-compose.yml ]; then
              backup_root="${DEPLOY_BACKUP_ROOT:-$HOME/.local/state/school-management-deploy/backend}"
              mkdir -p -- "$backup_root"
              backup_dir=$(mktemp -d "$backup_root/$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
              mv -- docker-compose.yml "$backup_dir/docker-compose.yml"
              echo "Saved server compose configuration in $backup_dir"
            fi
          fi

          echo "=== Resetting Working Tree ==="
          git reset --hard HEAD 2>/dev/null || true

          echo "=== Sync Remote Branch ==="
          git fetch origin "${{ secrets.BACKEND_BRANCH }}"
          git reset --hard "origin/${{ secrets.BACKEND_BRANCH }}"

          echo "=== Install/Update Dependencies ==="
          docker exec "${{ secrets.BACKEND_CONT_NAME }}" pip install --no-cache-dir -r requirements.txt

          echo "=== Run Migrations ==="
          docker exec "${{ secrets.BACKEND_CONT_NAME }}" python manage.py archive_legacy_migration
          docker exec "${{ secrets.BACKEND_CONT_NAME }}" python manage.py migrate --noinput

          echo "=== Collect Static Files ==="
          docker exec "${{ secrets.BACKEND_CONT_NAME }}" python manage.py collectstatic --noinput

          echo "=== Restart Container ==="
          docker restart "${{ secrets.BACKEND_CONT_NAME }}"

          echo "=== Deployment Successful... DevOps Team ==="

          SSHEOF

      - name: Cleanup SSH
        if: always()
        run: rm -rf "$HOME/.ssh"
